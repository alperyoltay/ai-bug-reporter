[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bug-reporter"
version = "0.1.0"
description = "Turn messy bug notes into structured, reproducible bug reports (offline rules or Claude)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alper Yoltay" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
ai = ["anthropic>=2.8"]
dev = ["pytest>=8"]

[project.scripts]
bugreport = "bugreporter.cli:main"

[tool.setuptools]
packages = ["bugreporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
